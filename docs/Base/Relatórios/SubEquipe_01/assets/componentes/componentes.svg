<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Diagrama de componentes do G4_ProjetoJogo</title>
<desc id="descricao">Estrutura interna do jogo com oito componentes, portas e interfaces fornecidas e requeridas ligadas por conectores de montagem. Interface do Jogador usa Controle da Partida. Controle da Partida usa Exploração, Combate, Alquimia, Inventário, Livro e Catálogo. Exploração, Combate e Alquimia usam Inventário. Alquimia registra descobertas no Livro. O Controle da Partida e os cinco módulos de domínio compartilham a interface do Catálogo.</desc>
<metadata>Versão 1.2; 13/09/2026; responsável: Yogi Nam de Souza Barbosa. Revisão a partir do diagrama de atividades. Notação: UML 2.5.1, componentes e portas simples. Referência visual: https://www.uml-diagrams.org/component-diagrams.html</metadata>
