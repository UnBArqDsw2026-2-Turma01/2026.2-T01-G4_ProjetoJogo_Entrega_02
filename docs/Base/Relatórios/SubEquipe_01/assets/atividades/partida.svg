<text x="54" y="364" class="owner" style="text-anchor:start">Partida em andamento</text>
<path id="e1" data-kind="control-flow" data-interrupts="" data-source="inicio" data-target="nova" data-guard="" class="flow" d="M 580 102.0 L 580 119.0" marker-end="url(#seta)"/>
<path id="e2" data-kind="control-flow" data-interrupts="" data-source="nova" data-target="inicializar" data-guard="" class="flow" d="M 580 197.0 L 580 222.0" marker-end="url(#seta)"/>
<path id="e3" data-kind="control-flow" data-interrupts="" data-source="inicializar" data-target="repetir" data-guard="" class="flow" d="M 580 310.0 L 580 372.0" marker-end="url(#seta)"/>
<path id="e4" data-kind="control-flow" data-interrupts="" data-source="repetir" data-target="escolher" data-guard="" class="flow" d="M 580 408.0 L 580 428.0" marker-end="url(#seta)"/>
<path id="e5" data-kind="control-flow" data-interrupts="" data-source="escolher" data-target="comando" data-guard="" class="flow" d="M 580 522.0 L 580 551.0" marker-end="url(#seta)"/>
<path id="e6" data-kind="control-flow" data-interrupts="" data-source="comando" data-target="explorar" data-guard="[mover ou coletar]" class="flow" d="M 548.0 575 L 210 575 L 210 643.0" marker-end="url(#seta)"/>
<path id="e7" data-kind="control-flow" data-interrupts="" data-source="comando" data-target="alquimia" data-guard="[combinar]" class="flow" d="M 564.0 587.0 L 500 620 L 500 657.0" marker-end="url(#seta)"/>
<path id="e8" data-kind="control-flow" data-interrupts="" data-source="comando" data-target="consultar" data-guard="[consultar]" class="flow" d="M 612.0 575 L 800 575 L 800 651.0" marker-end="url(#seta)"/>
<path id="e9" data-kind="control-flow" data-interrupts="" data-source="explorar" data-target="encontro" data-guard="" class="flow" d="M 210 761.0 L 210 826.0" marker-end="url(#seta)"/>
<path id="e10" data-kind="control-flow" data-interrupts="" data-source="encontro" data-target="combate" data-guard="[movimento válido e
inimigo ativo encontrado]" class="flow" d="M 210 874.0 L 210 915.0" marker-end="url(#seta)"/>
<path id="e11" data-kind="control-flow" data-interrupts="" data-source="encontro" data-target="retorno_explorar" data-guard="[else]" class="flow" d="M 178.0 850 L 67 850 L 67 1240 L 192.0 1240" marker-end="url(#seta)"/>
<path id="e12" data-kind="control-flow" data-interrupts="" data-source="combate" data-target="resultado" data-guard="" class="flow" d="M 210 1005.0 L 210 1036.0" marker-end="url(#seta)"/>
<path id="e13" data-kind="control-flow" data-interrupts="" data-source="resultado" data-target="vitoria" data-guard="[vitória]" class="flow" d="M 210 1084.0 L 210 1107.0" marker-end="url(#seta)"/>
