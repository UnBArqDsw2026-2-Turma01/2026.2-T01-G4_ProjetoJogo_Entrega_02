<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1490" viewBox="0 0 1400 1490" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Jogar uma partida</title>
<desc id="descricao">Fluxo geral da partida com exploração, combinação e combate como ações de alto nível. Uma região interrompível delimita a sessão ativa. O evento Sair solicitado pode interromper qualquer ação dessa região. Saída e derrota encerram as ações e retornam à tela inicial; vitória retorna à exploração.</desc>
<metadata>Versão 1.1; 13/09/2026; responsável: Yogi Nam de Souza Barbosa. UML 2.5.1, seções 15.6 e 16.10; slides de Modelagem UML Dinâmica, páginas 17 a 19; https://www.uml-diagrams.org/activity-diagrams.html</metadata>
<defs><marker id="seta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#222" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616;text-anchor:middle} .flow{fill:none;stroke:#222;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round} .node{fill:#fff;stroke:#222;stroke-width:1.8} .action{font-size:20px} .owner{font-size:16px} .rf{font-size:15px;fill:#444} .guard{font-size:17px;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round} .title{font-size:23px;font-weight:600}</style>
<rect width="1400" height="1490" fill="white"/>
<rect x="20" y="20" width="1360" height="1450" rx="14" class="node"/>
<text x="40" y="55" class="title" style="text-anchor:start">act Jogar uma partida</text>
